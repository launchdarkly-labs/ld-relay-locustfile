services:
  ldrelay:
    image: launchdarkly/ld-relay
    environment:
      - LD_ENV_BENCHMARK=${LAUNCHDARKLY_SDK_KEY}
      - LD_MOBILE_KEY_BENCHMARK=${LAUNCHDARKLY_MOBILE_KEY}
      - USE_EVENTS=true
    ports:
      - "8030:8030"

  master:
    image: locust-ld-relay
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LAUNCHDARKLY_SDK_KEY
      - LAUNCHDARKLY_MOBILE_KEY
      - LAUNCHDARKLY_HEARTBEAT_PROJECT
      - LAUNCHDARKLY_HEARTBEAT_API_KEY
      # Optional: "default", "streaming", or "polling" to run server users in
      # data saving mode. Needs a relay image of 9.0.0-rc.1 or later.
      - LAUNCHDARKLY_DATA_SYSTEM
      - LOCUST_HOST=http://ldrelay:8030
    depends_on:
      - ldrelay
    ports:
      - "8089:8089"
